<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="description" content="Games won in Impostral by each named human player and each Mistral AI model, ranked separately for the Standard and Hardcore rulesets." />

  <meta name="twitter:title" content="Impostral — Leaderboard" />

  <link rel="stylesheet" href="/static/style.css?v=20260730-v39" />
  <style>
    /* Two families of contestant, two hues, both validated for colorblind
       separation against the panel. Neither carries meaning alone: every row
       also prints its kind as a text badge and its win count as a number. */
    :root { --m-human: #ff8205; --m-ai: #e87ba4; }
    body { overflow: auto; }

    .stats-wrap { max-width: 1060px; }
    .stats-head { flex-wrap: wrap; align-items: flex-end; margin-bottom: 22px; }
    .stats-head .stats-title { display: flex; flex-direction: column; gap: 6px; }
    .stats-head .stats-kicker {
      color: var(--orange); font-family: var(--mono); font-size: 0.6rem;
      letter-spacing: 0.28em; text-transform: uppercase;
    }
    .stats-head p.stats-sub {
      margin: 0; max-width: 48ch; color: var(--muted);
      font-size: 0.72rem; line-height: 1.5;
    }

    /* --- Ruleset tabs ----------------------------------------------------- */
    .lb-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .lb-tabs button {
      min-height: 34px; padding: 0 16px;
      border: 1px solid var(--line-soft); background: transparent;
      color: var(--muted); font-family: var(--mono); font-size: 0.62rem;
      letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;
    }
    .lb-tabs button[aria-selected="true"] {
      border-color: var(--orange); background: var(--orange); color: #180900;
    }
    .lb-tabs button[data-mode="hardcore"][aria-selected="true"] {
      border-color: var(--red); background: var(--red); color: #fff2ee;
    }

    /* --- Hero KPI tiles --------------------------------------------------- */
    .lb-hero {
      display: grid; gap: 12px; margin-bottom: 26px;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }
    .lb-tile {
      position: relative; padding: 16px 16px 14px;
      background: var(--panel); border: 1px solid var(--line-soft);
      border-top: 2px solid var(--orange); overflow: hidden;
    }
    .lb-tile-num {
      font-family: var(--display); font-size: 2.1rem; line-height: 1;
      letter-spacing: 0.03em; color: var(--text); font-variant-numeric: tabular-nums;
    }
    .lb-tile-lbl {
      margin-top: 8px; color: var(--muted); font-size: 0.58rem;
      letter-spacing: 0.16em; text-transform: uppercase;
    }
    .lb-tile-sub {
      margin-top: 3px; color: var(--orange-bright);
      font-family: var(--mono); font-size: 0.62rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* --- Sections --------------------------------------------------------- */
    .lb-section { margin-top: 26px; }
    .lb-section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; padding-bottom: 10px; margin-bottom: 14px;
      border-bottom: 1px solid var(--line-soft);
    }
    .lb-section-title {
      margin: 0; color: var(--orange); font-size: 0.8rem;
      letter-spacing: 0.2em; text-transform: uppercase;
    }
    .lb-section-kicker {
      color: var(--faint); font-family: var(--mono); font-size: 0.6rem;
      letter-spacing: 0.14em; text-transform: uppercase;
    }

    /* --- Ranked rows ------------------------------------------------------ */
    .lb-board { display: flex; flex-direction: column; gap: 8px; }
    .lb-row {
      display: grid; align-items: center; gap: 14px;
      grid-template-columns: 46px minmax(0, 1fr) minmax(120px, 240px) 74px;
      padding: 12px 16px;
      background: var(--panel); border: 1px solid var(--line-soft);
      border-left: 3px solid var(--faint);
    }
    .lb-row.is-human {
      border-left-color: var(--orange);
      background:
        linear-gradient(90deg, rgba(255, 130, 5, 0.09), rgba(255, 130, 5, 0) 40%),
        var(--panel);
    }
    .lb-row.is-podium { border-color: var(--line); }
    .lb-rank {
      padding: 6px 0; text-align: center; color: var(--muted);
      font-family: var(--mono); font-size: 0.78rem; font-weight: 700;
      background: rgba(244, 239, 230, 0.05); border: 1px solid var(--line-soft);
      font-variant-numeric: tabular-nums;
    }
    .lb-row.is-podium .lb-rank {
      color: var(--gold); border-color: rgba(255, 216, 0, 0.4);
    }
    .lb-id { min-width: 0; }
    .lb-name {
      font-family: var(--mono); font-size: 0.92rem; font-weight: 700;
      color: var(--text); overflow-wrap: anywhere;
    }
    .lb-row.is-human .lb-name {
      font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .lb-id-meta {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px;
    }
    .lb-kind {
      padding: 2px 7px; color: var(--muted); font-size: 0.54rem;
      letter-spacing: 0.14em; text-transform: uppercase;
      border: 1px solid var(--line-soft);
    }
    .lb-kind-human { color: #180900; background: var(--orange); border-color: var(--orange); }
    .lb-played { color: var(--faint); font-size: 0.64rem; font-variant-numeric: tabular-nums; }

    /* Wins bar: length is the win count against the board leader, so the
       ranking stays readable without reading the numbers. */
    .lb-track { position: relative; height: 16px; background: rgba(244, 239, 230, 0.06); }
    .lb-fill {
      height: 100%; min-width: 3px; background: var(--orange);
      border-radius: 0 4px 4px 0;
      transition: width 500ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .lb-row:not(.is-human) .lb-fill { background: var(--m-ai); }
    .lb-wins { text-align: right; }
    .lb-wins-num {
      display: block; font-family: var(--display); font-size: 1.5rem; line-height: 1;
      color: var(--text); font-variant-numeric: tabular-nums;
    }
    .lb-wins-lbl {
      display: block; margin-top: 3px; color: var(--faint); font-size: 0.52rem;
      letter-spacing: 0.12em; text-transform: uppercase;
    }

    /* --- Details table ---------------------------------------------------- */
    .lb-table-scroll { overflow-x: auto; border: 1px solid var(--line-soft); }
    .lb-table { width: 100%; border-collapse: collapse; font-size: 0.74rem; }
    .lb-table th, .lb-table td {
      padding: 9px 12px; text-align: right; white-space: nowrap;
      border-bottom: 1px solid var(--line-soft);
    }
    .lb-table thead th {
      position: sticky; top: 0; color: var(--muted); font-size: 0.58rem;
      font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
      background: var(--panel-strong);
    }
    /* Rank, player, and kind read as identity, not as figures. */
    .lb-table th:nth-child(-n + 3), .lb-table td:nth-child(-n + 3) { text-align: left; }
    .lb-table tbody td { font-variant-numeric: tabular-nums; color: var(--text); }
    .lb-table .lb-cell-name {
      color: var(--muted); font-family: var(--mono); white-space: normal;
      overflow-wrap: anywhere;
    }
    .lb-table tbody tr:last-child td { border-bottom: none; }
    .lb-table tbody tr.is-human td { background: rgba(255, 130, 5, 0.06); }
    .lb-table tbody tr.is-human .lb-cell-name { color: var(--orange-bright); font-weight: 700; }

    /* --- States & footer -------------------------------------------------- */
    .lb-empty {
      padding: 48px 20px; text-align: center;
      background: var(--panel); border: 1px solid var(--line-soft);
    }
    .lb-empty-title {
      color: var(--text); font-family: var(--display); font-size: 1.15rem;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    .lb-empty-body {
      margin: 10px auto 0; max-width: 44ch; color: var(--muted);
      font-size: 0.72rem; line-height: 1.5;
    }
    .lb-meta { margin: 18px 0 0; color: var(--faint); font-size: 0.66rem; line-height: 1.6; }

    @media (max-width: 620px) {
      .lb-row { grid-template-columns: 40px minmax(0, 1fr) 64px; }
      .lb-track { display: none; }
      .lb-wins-num { font-size: 1.25rem; }
    }
  </style>
</head>
<!-- `data-screen="page"` : la barre du site reprend le gabarit plat de la
     landing (cf. style.css). -->
<body data-screen="page">
  <div class="app-shell">
    <header class="hud-header">
      <a class="brand" href="/" aria-label="Impostral — home">
        <img src="/assets/impostral.png" alt="Impostral" />
      </a>
      <nav class="hud-nav">
        <a href="/stats.html">Stats</a>
        <a href="/about.html">About</a>
        <a href="/">Back to game</a>
      </nav>
    </header>

    <main class="stats-main">
      <div class="stats-wrap">
        <div class="stats-head">
          <div class="stats-title">
            <span class="stats-kicker">Hall of fame // games won</span>
            <h1>Leaderboard</h1>
            <p class="stats-sub">
              Every contestant ranked by games won: human players who entered a
              pseudo, and each Mistral model behind the AI seats.
            </p>
          </div>
          <button class="btn" id="refresh" type="button"
            style="min-height:36px; padding:0 16px; font-size:0.62rem;">Refresh</button>
        </div>
        <!-- Les deux règlements ne récompensent pas la même chose : une victoire
             hardcore se gagne en survivant à ceux qu'on a fait sortir. Classements
             séparés, jamais fusionnés. -->
        <div id="mode-tabs" class="lb-tabs" role="tablist" aria-label="Ruleset">
          <button type="button" role="tab" aria-selected="true" data-mode="standard">Standard</button>
          <button type="button" role="tab" aria-selected="false" data-mode="hardcore">Hardcore</button>
        </div>
        <div id="content"></div>
      </div>
    </main>
  </div>

  <script src="/static/leaderboard.js?v=20260730-v39" defer></script>
</body>
</html>
